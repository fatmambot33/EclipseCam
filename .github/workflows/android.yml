name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Test, lint and build debug APKs
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: EclipseCam-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EclipseCam-lint-${{ github.run_number }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

  emulator-instrumentation:
    name: emulator-instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation suite
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p build/instrumentation-evidence
            adb logcat -c
            status=0
            gradle --no-daemon connectedDebugAndroidTest || status=$?
            adb logcat -d > build/instrumentation-evidence/logcat.txt || true
            if [ "$status" -ne 0 ]; then
              adb exec-out screencap -p > build/instrumentation-evidence/failure-screen.png || true
              adb shell dumpsys activity > build/instrumentation-evidence/activity.txt || true
              adb shell dumpsys notification > build/instrumentation-evidence/notifications.txt || true
            fi
            exit "$status"

      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EclipseCam-instrumentation-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            build/instrumentation-evidence/**
          if-no-files-found: warn
          retention-days: 14

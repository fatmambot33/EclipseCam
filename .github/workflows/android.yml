name: EclipseCam Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build to create
        required: true
        default: debug
        type: choice
        options:
          - debug
          - play-release
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore upload keystore
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'play-release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ECLIPSE_CAM_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/eclipsecam-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eclipsecam-signing/eclipsecam-upload.jks"
          chmod 600 "$RUNNER_TEMP/eclipsecam-signing/eclipsecam-upload.jks"

      - name: Test and build debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug'
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Build signed Play bundle
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'play-release'
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          ECLIPSE_CAM_STORE_FILE: ${{ runner.temp }}/eclipsecam-signing/eclipsecam-upload.jks
          ECLIPSE_CAM_STORE_PASSWORD: ${{ secrets.ECLIPSE_CAM_STORE_PASSWORD }}
          ECLIPSE_CAM_KEY_ALIAS: ${{ secrets.ECLIPSE_CAM_KEY_ALIAS }}
          ECLIPSE_CAM_KEY_PASSWORD: ${{ secrets.ECLIPSE_CAM_KEY_PASSWORD }}
        run: gradle --no-daemon clean testDebugUnitTest lintRelease bundleRelease

      - name: Upload debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: EclipseCam-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Play bundle
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'play-release'
        uses: actions/upload-artifact@v4
        with:
          name: EclipseCam-Play-${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/eclipsecam-signing"

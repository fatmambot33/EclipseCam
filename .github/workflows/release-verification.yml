name: Release Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Self-test release verifier
        run: python3 .github/scripts/verify-release.py self-test

      - name: Scan tracked source for secrets and signing material
        run: python3 .github/scripts/verify-release.py scan-source

      - name: Re-run runtime privacy audit
        run: python3 .github/scripts/audit-privacy.py

      - name: Test, lint and build unsigned release AAB
        run: gradle --no-daemon testDebugUnitTest lintRelease bundleRelease

      - name: Inspect unsigned release artifact
        shell: bash
        run: |
          set -euo pipefail
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -n "$AAB"
          python3 .github/scripts/verify-release.py inspect-artifact "$AAB"
          MANIFEST="$(find app/build/intermediates -type f -name AndroidManifest.xml -path '*release*' -print -quit || true)"
          if [[ -n "$MANIFEST" ]]; then
            cp "$MANIFEST" build/release-verification/merged-release-AndroidManifest.xml
          fi

      - name: Upload unsigned AAB and release evidence
        uses: actions/upload-artifact@v4
        with:
          name: EclipseCam-unsigned-release-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/lint-results-release.*
            build/release-verification/**
            build/privacy-audit/evidence.txt
          if-no-files-found: error
          retention-days: 30
